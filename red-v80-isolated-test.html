<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTF Falcon RED Test</title><style>body{font-family:system-ui;background:#07111f;color:#eef;padding:24px;max-width:850px;margin:auto}button,input{font-size:18px;padding:12px;margin:8px}.box{background:#101d31;padding:18px;border-radius:14px;margin-top:18px}.flag{font:700 22px monospace;direction:ltr;background:#092b22;padding:14px;border-radius:10px;overflow-wrap:anywhere}</style><h1>🦅 RED — RGBA LSB isolated test</h1><p>اختبار مستقل لا يغيّر محركات صقر المستقرة.</p><input id="f" type="file" accept=".png,image/png"><button id="go">حلّل RED</button><div id="out" class="box">بانتظار الملف…</div><script>
const q=x=>document.getElementById(x), esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
q('go').onclick=async()=>{
 const file=q('f').files[0],out=q('out'); if(!file){out.textContent='اختر red.png أولًا';return}
 out.textContent='جارٍ التحليل…';
 try{
  const img=await createImageBitmap(file),cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);const p=cx.getImageData(0,0,cv.width,cv.height).data;
  let bytes=[],v=0,n=0;
  for(let i=0;i<p.length;i+=4)for(let c=0;c<4;c++){v=(v<<1)|(p[i+c]&1);if(++n===8){bytes.push(v);v=0;n=0}}
  let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.slice(i,i+8192));
  const toks=s.match(/[A-Za-z0-9+/]{12,}={0,2}/g)||[];let hits=[];
  for(const t of toks){try{const d=atob(t),m=d.match(/[A-Za-z][A-Za-z0-9_.:-]{1,30}\{[^{}\r\n]{2,200}\}/g)||[];for(const x of m)if(!hits.includes(x))hits.push(x)}catch(e){}}
  out.innerHTML=hits.length?'<b>🎉 نجح RGBA LSB</b><p>PNG → RGBA LSB → Base64 → Flag</p>'+hits.map(x=>'<div class="flag">'+esc(x)+'</div>').join(''):'<b>⚠️ لم يظهر Flag</b><p>أول 120 بايت بعد RGBA LSB:</p><pre>'+esc(s.slice(0,120))+'</pre>';
 }catch(e){out.textContent='خطأ: '+e.message}
};
</script></html>
